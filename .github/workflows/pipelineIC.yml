     ##   run: |
     ##     --network zap-net \
     ##       docker run --rm \
     ##       ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
     ##      
     ##       -J report_json.json -w report_md.md -r report_html.html \
     ##       -t http://reddit-clone-yt:3000/ \
     ##       -I
name: DevSecOps Pipeline - Laboratorio Final

on:
  push:
    branches:
      - feat-sast

jobs:
  clone-repository:
    name: Clonar repositorio y preparar entorno
    runs-on: ubuntu-latest
    
    steps:
    # Paso 1: Clonación del repositorio
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Clona todo el historial de commits
        path: src      # Opcional: clona en un subdirectorio específico

    # Verificación de la clonación (opcional)
    - name: Verify repository structure
      run: |
        echo "Contenido del repositorio clonado:"
        ls -la src/
        echo ""
        echo "Estructura de directorios:"
        tree -L 2 src/
        
    # Configuración inicial del entorno (opcional)
    - name: Set up environment
      run: |
        echo "Configurando entorno de trabajo..."
        cd src
        echo "Ruta actual: $(pwd)"
        echo "Versión de Python: $(python --version || echo 'Python no encontrado')"
        echo "Versión de Docker: $(docker --version || echo 'Docker no encontrado')"
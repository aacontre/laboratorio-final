name: Pipeline Laboratorio Final

on:
  push:
    branches:
      - feat-movie

jobs:
  Despliegue:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4  

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Run SonarCloud Analysis
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        sonar-scanner \
          -Dsonar.organization=devsecops-usash \  # Nombre de la org en SonarCloud
          -Dsonar.projectKey=labaratorio-final\
          -Dsonar.sources=. \
          -Dsonar.host.url=https://sonarcloud.io  # Para SonarQube usa tu URL
name: Pipeline - Laboratorio Final

on:
  push:
    branches:
      - feat-movie

jobs:
  SAST:
    runs-on: ubuntu-latest
      
    steps: 
      - name: Descargar repositorio 
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9' 
      
      - name: Instalar dependencias 
        run: |
          python -m pip install --upgrade pip
    
        
      - name: Ejecutando SonarCloud 
        uses: SonarSource/sonarqube-scan-action@master 
        env: 
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: > 
            -Dsonar.projectKey=aacontre_laboratorio-final 
            -Dsonar.organization=aacontre
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.branch.name=feat-movie

      - name: Validando resultado de SonarCloud
        run: |

          issueValidate=$(curl -s -X GET -u '${{ secrets.SONAR_TOKEN }}:' 'https://sonarcloud.io/api/issues/search?branch=main&componentKeys=laboratorio-final&facets=severities' | jq '.facets[0].values[1].count')
          if [ "$issueValidate" -gt 0 ]; then
          echo "Existen problemas en el código, se detiene el pipeline"
          #exit 1
          else
          echo "No existen problemas en el código, se continúa con el pipeline"
          fi            

 ####################################################################################################################################################################################################################################         

  SCA:
    needs: SAST
    runs-on: ubuntu-latest

    steps: 
    - name: Descargar repositorio 
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9' 
    
    - name: Instalar dependencias 
      run: |
          python -m pip install --upgrade pip
        #--pip install safety

    - name: Configurar Java para OWASP 
      uses: actions/setup-java@v4
      with:
          distribution: 'temurin' # Distribución recomendada de Java
          java-version: '17'   
    
    - name: Ejecutar OWASP
      uses: jeremylong/Dependency-Check-Action@main
      id: depcheck # Asigna un ID para referenciar los outputs
      with:
        project: 'laboratorio-final' # Nombre de tu proyecto
        path: '.' # Ruta donde se encuentra tu código para escanear
        format: 'HTML,JSON' # Formatos de reporte deseados
        args: '--scan bin --scan src' # Puedes ajustar los directorios a escanear
            # --failOnCVSS 7 # Descomenta para fallar el pipeline si se encuentran vulnerabilidades con CVSS score >= 7
name: Pipeline Laboratorio Final

on:
  push:
    branches: [feat-movie]
  pull_request:
    branches: [feat-movie]

jobs:
  devsecops:
    runs-on: ubuntu-latest

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_PROJECT_KEY: laboratorio-final
      SONAR_ORG: laboratorio-final-movie
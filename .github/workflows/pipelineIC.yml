name: Pipeline - Laboratorio Final

on:
  push:
    branches:
      - feat-movie

jobs:
  sonarcloud_analysis:
    name: SAST
    runs-on: ubuntu-latest # Usa el último runner de Ubuntu

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          # Obtiene todo el historial para datos SCM precisos (blame, fechas de creación de issues)
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9' # O la versión de Python que use tu aplicación
          
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
     

    
        

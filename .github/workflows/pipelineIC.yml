name: Pipeline movoie
on:
  push:
    branches: [ main, feature/devsecops-pipeline ]
  pull_request:
    branches: [ main ]

env:
  APP_NAME: "movies-app"
  IMAGE_TAG: "latest"
  SONAR_PROJECT_KEY: "laboratorio-final"

jobs:
  security-pipeline:
    name: Security Pipeline
    runs-on: ubuntu-latest
    
    steps:
    # 1. Clonación del repositorio
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Necesario para SonarCloud

    # 2. SAST con SonarCloud
    - name: Set up Java for SonarScanner
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: SonarCloud Scan
      uses: SonarSource/sonarcloud-github-action@master
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        args: >
          -Dsonar.qualitygate.wait=true
          -Dsonar.qualitygate.timeout=600
          -Dsonar.qualitygate.failOnMedium=true
          -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
          -Dsonar.organization=devsecops-usash
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.python.version=3.9
          -Dsonar.sources=app/
          -Dsonar.exclusions=**/tests/**
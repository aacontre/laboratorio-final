name: Pipeline Laboratorio Final

on:
  push:
    branches:
      - feat-movie

jobs:
  Despliegue:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4  

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Validando existencia de proyecto en SonarCloud
        id: validateProjectOnSonar
        run: |
          set +e
          curl -f -X POST -u '${{ secrets.SONAR_TOKEN }}:' \
            'https://sonarcloud.io/api/projects/create' \
            -d 'name=${{ github.event.repository.name }}' \
            -d 'project=${{ github.event.repository.name }}' \
            -d 'organization=devsecops-usash' \
            -d 'visibility=public'
          
          if [ $? -ne 0 ]; then
            echo "Proyecto ya existe en Sonarcloud"
            echo "proyectoExiste=1" >> $GITHUB_OUTPUT
          else
            echo "Proyecto ${{ github.event.repository.name }} creado exitosamente en Sonarcloud"
            curl -X POST -u '${{ secrets.SONAR_TOKEN }}:' \
              'https://sonarcloud.io/api/project_branches/rename' \
              -d 'name=main' \
              -d 'project=${{ github.event.repository.name }}'
          fi
          set -e
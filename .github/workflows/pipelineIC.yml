name: Pipeline - Laboratorio Final

on:
  push:
    branches:
      - feat-movie

jobs:
  SAST:
    runs-on: ubuntu-latest
      
    steps: 
      - name: Descargar repositorio 
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9' 
      
      - name: Instalar dependencias 
        run: |
          python -m pip install --upgrade pip
    
        
      - name: Ejecutando SonarCloud 
        uses: SonarSource/sonarqube-scan-action@master 
        env: 
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: > 
            -Dsonar.projectKey=aacontre_laboratorio-final 
            -Dsonar.organization=aacontre
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.branch.name=feat-movie

      - name: Validando resultado de SonarCloud
        run: |

          issueValidate=$(curl -s -X GET -u '${{ secrets.SONAR_TOKEN }}:' 'https://sonarcloud.io/api/issues/search?branch=main&componentKeys=laboratorio-final&facets=severities' | jq '.facets[0].values[1].count')
          #if [ "$issueValidate" -gt 0 ]; then
          #echo "Existen problemas en el código, se detiene el pipeline"
          #exit 1
          #else
          #echo "No existen problemas en el código, se continúa con el pipeline"
          #fi            

 ####################################################################################################################################################################################################################################         

  SCA:
    needs: SAST
    runs-on: ubuntu-latest

    steps: 
    - name: Descargar repositorio 
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 
  
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9' 
      
    - name: Instalar dependencias del proyecto y Safety CLI
      run: |
              python -m pip install --upgrade pip 
              pip install safety==2.3.5  
              pip install --upgrade safety "pydantic>=2.0.0" 
              pip install -r requirements.txt 
    
    - name: Ejecutar Safety Scan (Análisis SCA Nativo Python)
      env:
        SAFETY_API_KEY: '${{ secrets.SAFETY_API_KEY }}' 
      run: |
        safety scan --full-report --output safety_report.json
          
          
       ## - name: Subir Reporte Safety Scan
          # Sube el reporte JSON generado por Safety como un artefacto de tu workflow.
          # Esto te permite descargar y revisar los resultados de seguridad directamente
          # desde la interfaz de GitHub Actions una vez que el pipeline haya terminado.
         # uses: actions/upload-artifact@v4
          #with:
           # name: safety-scan-report # Nombre con el que aparecerá el artefacto en GitHub
          ##  path: safety_report.json # La ruta al archivo de reporte generado por Safety
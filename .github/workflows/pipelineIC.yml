name: Pipeline Laboratorio Final
on:
  push:
    branches: [ main, develop, feat-movie ]
  pull_request:
    branches: [ main, develop, feat-movie ]

jobs:
  GenerandoBuild:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'

      - name: Check del codigo
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: npm install

      - name: Compilar y empaquetar
        run: |
          npm run build

      - name: Acualizando artefacto
        uses: actions/upload-artifact@master
        with:
           name: build-artifact
           path: ${{ github.workspace }}/.next
           include-hidden-files: true

  AnalisisSAST:
      needs: GenerandoBuild
      runs-on: ubuntu-latest
      steps:
       - name: Check del codigo
         uses: actions/checkout@v2
        
       - name: Descarga de artefacto
         uses: actions/download-artifact@master
         with:
             name: build-artifact
             path: ${{ github.workspace }}/.next
           

       - name: Validando existencia del proyecto en sonar
         run: |
               set +e
               curl -f -X POST -u '${{ secrets.SONAR_TOKEN }}:' 'https://sonarcloud.io/api/projects/create' -d 'name=laboratorio-finalv2' -d 'project=laboratorio-finalv2' -d 'organization=aacontre' -d 'visibility=public'
               if [ $? -ne 0 ]; then
                 echo "Proyecto ya existe en Sonarcloud"
                 echo "::set-output name=proyectoExiste::1"
               else
                 echo "Proyecto laboratorio-finalv2 creado exitosamente en Sonarcloud"
               
                 echo "Se establece rama main como rama por defecto"
                 curl -X POST -u "${{ secrets.SONAR_TOKEN }}:" 'https://sonarcloud.io/api/project_branches/rename' -d 'name=main' -d 'project=laboratorio-finalv2'
               fi
               set -e

        
       - name: Ejecutando SonarCloud
         run: |
                npx sonarqube-scanner \
                -Dsonar.projectKey=laboratorio-finalv2 \
                -Dsonar.organization=aacontre \
                -Dsonar.sources=. \
                -Dsonar.host.url=https://sonarcloud.io \
                -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
                -Dsonar.branch.name=main
       
       - name: Extrayendo analisis desde SonarCloud
         run: |
        
           projectKey="laboratorio-finalv2"
           branchName="main" 

           issueCount=$(curl -s -u "${{ secrets.SONAR_TOKEN }}:" \
           "https://sonarcloud.io/api/issues/search?componentKeys=${projectKey}&branch=${branchName}&types=VULNERABILITY&severities=BLOCKER,CRITICAL,MAJOR" \
             | jq '.total')
            echo "Se encontraron vulneradidades críticas/altas/medias: $issueCount"

               if [ "$issueCount" -gt 0 ]; then
                  echo "Se encontraron vulnerabilidades críticas, altas o medias. Deteniendo el pipeline..."
            exit 1
            else
            echo "No se encontraron vulnerabilidades ..."
            fi
             
  AnalisisSCA:
    needs: GenerandoBuild
    runs-on: ubuntu-latest
    steps:
      - name: Check del codigo
        uses: actions/checkout@v2
       
      - name: Descarga de artefacto
        uses: actions/download-artifact@master
        with:
            name: build-artifact
            path: ${{ github.workspace }}/.next
            include-hidden-files: true

      - name: Ejecutando Owasp
        uses: dependency-check/Dependency-Check_Action@1.1.0
        env:
          JAVA_HOME: /opt/jdk
        with:
          project: '${{ github.event.repository.name }}'
          path: '.'
          format: 'ALL'
          out: 'reports'
          args: >
            --failOnCVSS 7
            --enableRetired

      - name: Subiendo resulado de Owasp
        uses: actions/upload-artifact@master
        with:
          name: dependecy-check-report
          path: ${{ github.workspace }}/reports

      - name: Validar resulado de Owasp
        run: |
          report="reports/dependency-check-report.json"
          
          if [ ! -f "$report" ]; then
            echo "Falla el análisis SCA."
            exit 1
          fi

            critical=$(jq '[.dependencies[].vulnerabilities[]? | select(.severity == "high")] | length' "$report")
            high=$(jq '[.dependencies[].vulnerabilities[]? | select(.severity == "high")] | length' "$report")
            medium=$(jq '[.dependencies[].vulnerabilities[]? | select(.severity == "moderate")] | length' "$report")

            echo "Vulnerabilidades críticas/altas: $critical"
            echo "Vulnerabilidades medias: $medium"

          if [ "$critical" -gt 0 ] || [ "$high" -gt 0 ] || [ "$medium" -gt 0 ]; then
            echo "Mala suerte ..... SI se encontraron vulnerabilidades . El pipeline no sigue..."
            exit 1
          else
            echo "Tienes mucha suerte .... NO se encontraron vulnerabilidades"
          fi

  GenerandoImagenDocker:
    needs: GenerandoBuild
    runs-on: ubuntu-latest
    steps:
    
      - name: Check del codigo
        uses: actions/checkout@v2
      
      - name: Descarga de artefacto
        uses: actions/download-artifact@master
        with:
             name: build-artifact
             path: ${{ github.workspace }}/.next
             include-hidden-files: true

      - name: Build Docker Image
        run: |
          docker build --tag aacontre/laboratorio-finalv2:latest .

      - name: Docker Login
        uses: docker/login-action@v3.0.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker Image
        run: |
          docker push aacontre/laboratorio-finalv2:latest

    
  EjecutandoImageSecurity:
    needs: GenerandoImagenDocker
    runs-on: ubuntu-latest
    steps:

      - name: Docker Login
        uses: docker/login-action@v3.0.0  
        with:
              username: ${{ secrets.DOCKER_USER }}
              password: ${{ secrets.DOCKER_PASSWORD }}
    
      - name: Docker Pull
        run: |
              docker pull aacontre/laboratorio-finalv2:latest
    
      - name: Ejecutando Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
              image-ref: aacontre/laboratorio-finalv2:latest
              format: 'table'
              exit-code: '1'
              severity: 'CRITICAL,HIGH,MEDIUM'

      

  AnalisisDAST:
    needs: GenerandoImagenDocker
    runs-on: self-hosted
    steps:
      - name: LAN Docker
        run: |
              docker network rm zap-net || true
              docker network create zap-net
            
      - name: Desplegando app en Docker
        run: |
              docker run -d \
              --rm \
              --network zap-net \
              --name reddit-clone-yt \
              -p 3000:3000 \
              aacontre/laboratorio-finalv2:latest
      
      - name: Esperando a que la app este lista
        run: |
              echo "Esperando a que la app este lista..."
              sleep 30  # Ajusta el tiempo según sea necesario
              
      - name: Ejecutando OWASP ZAP
        run: |
              docker run --rm \
              --network zap-net \
              -t owasp/zap2docker-stable zap-baseline.py \
              -J report_json.json -w report_md.md -r report_html.html \
              -t http://reddit-clone-yt:3000/ \
              -I  

      - name: Subiendo reporte OWASP ZAP
        uses: actions/upload-artifact@v2
        with:
              name: zap-reports
              path: ${{ github.workspace }}
              #retention-days: 7
     
      - name: OWASP 
        run: |
              --network zap-net \
                docker run --rm \
                ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
          
               -J report_json.json -w report_md.md -r report_html.html \
               -t http://reddit-clone-yt:3000/ \
               -I



      - name: Mover reportes de ZAP al directorio reports
        run: |
            mkdir -p reports
            mv report_*.json reports/ || true
            mv report_*.md reports/ || true
            mv report_*.html reports/ || true

      - name: Upload OWASP ZAP Report
        uses: actions/upload-artifact@master
        with:
             name: owasp-zap-report
             path: ${{ github.workspace }}/reports

      - name: Validar resultado de OWASP ZAP
        run: |
          if [ ! -f report_json.json ]; then
          echo "Mala suerte ..... SI se encontraron vulnerabilidades . El pipeline no sigue..."
          exit 1
          fi

          highAlerts=$(jq '[.site[].alerts[] | select(.riskdesc | test("High"))] | length' report_json.json)
          mediumAlerts=$(jq '[.site[].alerts[] | select(.riskdesc | test("Medium"))] | length' report_json.json)

          echo "Alertas High: $highAlerts"
          echo "Alertas Medium: $mediumAlerts"

          if [ "$highAlerts" -gt 0 ] || [ "$mediumAlerts" -gt 0 ]; then
          echo "Se encontraron vulnerabilidades críticas o medias en OWASP ZAP. Deteniendo el pipeline..."
          exit 1
          else
          echo "Tienes mucha suerte .... NO se encontraron vulnerabilidades""
          fi
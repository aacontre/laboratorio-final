name: Pipeline - Laboratorio Final

on:
  push:
    branches:
      - feat-movie

jobs:
  sonarcloud_analysis:
    name: SAST
    runs-on: ubuntu-latest # Usa el último runner de Ubuntu

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          # Obtiene todo el historial para datos SCM precisos (blame, fechas de creación de issues)
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9' # O la versión de Python que use tu aplicación

<<<<<<< HEAD
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov # Instala herramientas de prueba y cobertura

      - name: Ejecutar pruebas y recolectar cobertura
        run: |
          pytest --cov=. --cov-report=xml # Genera informe de cobertura en formato XML
        

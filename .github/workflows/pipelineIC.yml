name: Pipeline - Laboratorio Final

on:
  push:
    branches:
      - feat-movie

jobs:
  sonarcloud_analysis:
    name: SAST
    runs-on: ubuntu-latest
    env:
      APP_PATH: 'src'
      
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel

      - name: instalar SonarScanner
        run: |
          # Descarga la última versión de SonarScanner
          wget https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006.zip -O sonar-scanner.zip
          unzip sonar-scanner.zip
          # Mueve el scanner a una ubicación accesible y agrega a PATH
          sudo mv sonar-scanner-*/bin/sonar-scanner /usr/local/bin/
          echo "/usr/local/bin/sonar-scanner" >> $GITHUB_PATH
          echo "export PATH=$PATH:/usr/local/bin/sonar-scanner" >> $GITHUB_ENV
          # Verifica la instalación
          sonar-scanner --version || echo "SonarScanner no se instaló correctamente"

      - name: 2. Análisis SAST con SonarCloud
        uses: SonarSource/sonarqube-scan-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=aacontre-laboratorio-final
            -Dsonar.projectName="Laboratorio Final"
            -Dsonar.organization=aacontreGithub
            -Dsonar.host.url=https://sonarcloud.io
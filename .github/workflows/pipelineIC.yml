name: Pipeline - Laboratorio Final

on:
  push:
    branches:
      - feat-movie

jobs:
  clone-repository:
    name: Clonar repositorio y preparar entorno
    runs-on: ubuntu-latest
    
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_PROJECT_KEY: laboratorio-final
      SONAR_ORG: olimpo 


    steps:
    
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  
        path: src      

    
    - name: Verify repository structure
      run: |
        echo "Repositorio clonado:"
        ls -la src/
        echo ""
        echo "Estructura de directorios:"
        tree -L 2 src/
        
   
    - name: Set up environment
      run: |
        echo "Entorno de trabajo..."
        cd src
        echo "Ruta actual: $(pwd)"
        echo "Versión de Python: $(python --version || echo 'Python no encontrado')"
        echo "Versión de Docker: $(docker --version || echo 'Docker no encontrado')"


    - name: Validando existencia de proyecto en SonarCloud
      id: validateProjectOnSonar
      run: |
        #pwd
        #ls -R
        set +e
        curl -f -X POST -u '${{ secrets.SONAR_TOKEN }}:' 'https://sonarcloud.io/api/projects/create' -d 'name=${{ github.event.repository.name }}' -d 'project=${{ github.event.repository.name }}' -d 'organization=olimpo' -d 'visibility=public'
        if [ $? -ne 0 ]; then
          echo "Proyecto ya existe en Sonarcloud"
          echo "::set-output name=proyectoExiste::1"
        else
          echo "Proyecto ${{ github.event.repository.name }} creado exitosamente en Sonarcloud"
          
          echo "Se establece rama main como rama por defecto"
          curl -X POST -u '${{ secrets.SONAR_TOKEN }}:' 'https://sonarcloud.io/api/project_branches/rename' -d 'name=main' -d 'project=${{ github.event.repository.name }}'
        fi
        set -e

        
name: Pipeline - Laboratorio Final

on:
  push:
    branches:
      - feat-movie

jobs:
  SAST:
    runs-on: ubuntu-latest
      
    steps: 
      - name: Descargar repositorio 
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9' 
      
      - name: Instalar dependencias 
        run: |
          python -m pip install --upgrade pip
    
        
      - name: Ejecutando SonarCloud 
        uses: SonarSource/sonarqube-scan-action@master 
        env: 
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: > 
            -Dsonar.projectKey=aacontre_laboratorio-final 
            -Dsonar.organization=aacontre
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.branch.name=feat-movie

      - name: Validando resultado de SonarCloud
        run: |

          issueValidate=$(curl -s -X GET -u '${{ secrets.SONAR_TOKEN }}:' 'https://sonarcloud.io/api/issues/search?branch=main&componentKeys=laboratorio-final&facets=severities' | jq '.facets[0].values[1].count')
          #if [ "$issueValidate" -gt 0 ]; then
          #echo "Existen problemas en el código, se detiene el pipeline"
          #exit 1
          #else
          #echo "No existen problemas en el código, se continúa con el pipeline"
          #fi            

 ####################################################################################################################################################################################################################################         

  SCA:
    needs: SAST
    runs-on: ubuntu-latest

    steps: 
    - name: Descargar repositorio 
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9' 
    
    - name: Install Python dependencies
      run: |
          pip install -r requirements.txt  
          
    - name: Set up Java 17 (LTS)
      uses: actions/setup-java@v3
      with:
            java-version: '17'
            distribution: 'temurin'
         #   cache: 'gradle'
  
    - name: Verify Java installation
      run: |
            echo "JAVA_HOME: $JAVA_HOME"
            java -version

    - name: Install Dependency-Check
      run: |
          # Instalar versión más reciente directamente
            DC_VERSION=8.4.0
            curl -sLO https://github.com/jeremylong/DependencyCheck/releases/download/v$DC_VERSION/dependency-check-$DC_VERSION-release.zip
            unzip dependency-check-$DC_VERSION-release.zip
            echo "$PWD/dependency-check/bin" >> $GITHUB_PATH
name: Pipeline Laboratorio Final
on:
  push:
    branches: [ main, develop, feat-movie ]
  pull_request:
    branches: [ main, develop, feat-movie ]

jobs:
  GenerandoBuild:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'

      - name: Check del codigo
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: npm install

      - name: Compilar y empaquetar
        run: |
          npm run build

      - name: Acualizando artefacto
        uses: actions/upload-artifact@master
        with:
          name: build-artifact
          path: ${{ github.workspace }}/.next
          include-hidden-files: true

  SAST:
      needs: GenerandoBuild
      runs-on: ubuntu-latest
      steps:
       - name: Check del codigo
         uses: actions/checkout@v2
        
       - name: Descarga de artefacto
         uses: actions/download-artifact@master
         with:
             name: build-artifact
             path: ${{ github.workspace }}/.next
             include-hidden-files: true

       - name: Validando existencia del proyecto en sonar
         run: |
               set +e
               curl -f -X POST -u '${{ secrets.SONAR_TOKEN }}:' 'https://sonarcloud.io/api/projects/create' -d 'name=laboratorio-finalv2' -d 'project=laboratorio-finalv2' -d 'organization=aacontre' -d 'visibility=public'
               if [ $? -ne 0 ]; then
                 echo "Proyecto ya existe en Sonarcloud"
                 echo "::set-output name=proyectoExiste::1"
               else
                 echo "Proyecto laboratorio-finalv2 creado exitosamente en Sonarcloud"
               
                 echo "Se establece rama main como rama por defecto"
                 curl -X POST -u "${{ secrets.SONAR_TOKEN }}:" 'https://sonarcloud.io/api/project_branches/rename' -d 'name=main' -d 'project=laboratorio-finalv2'
               fi
               set -e